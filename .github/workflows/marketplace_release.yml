name: Publish Plugin to JetBrains Marketplace

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Marketplace channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - alpha

permissions:
  contents: read

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Check Marketplace token
        env:
          MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [[ -z "$MARKETPLACE_TOKEN" ]]; then
            echo "::error::Set the JETBRAINS_MARKETPLACE_TOKEN repository secret to a JetBrains Marketplace personal access token. GitHub's GITHUB_TOKEN cannot authenticate to JetBrains Marketplace."
            exit 1
          fi

      - name: Build, verify, and publish plugin
        env:
          ORG_GRADLE_PROJECT_intellijPlatformPublishingToken: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          ORG_GRADLE_PROJECT_publishChannel: ${{ inputs.channel }}
        run: |
          chmod +x ./gradlew
          ./gradlew test verifyPluginStructure publishPlugin
